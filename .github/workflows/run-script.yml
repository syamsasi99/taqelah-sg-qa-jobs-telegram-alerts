name: Telegram Bot Notification

on:
  # Manual trigger with environment input
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

  schedule:
    - cron: '00 00 * * *'

jobs:
  notify:
    runs-on: ubuntu-latest

    # Scheduled runs are always production; a manual run honours the choice.
    # The job MUST declare the environment it wants, because GitHub only
    # injects secrets belonging to the environment named here.
    environment: ${{ inputs.environment || 'production' }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests --disable-warnings --maxfail=1

      # Rotating key: actions/cache never overwrites an existing key, so a
      # static one would pin the very first jobs.db forever. Writing a new key
      # each run and restoring the newest match by prefix keeps the sent-job
      # ledger alive between runs.
      #
      # The environment is part of the prefix so staging and production keep
      # separate ledgers - a shared one would let a staging dispatch mark jobs
      # as sent and silently suppress them in production.
      - name: Restore jobs.db
        uses: actions/cache@v4
        with:
          path: jobs.db
          key: jobs-db-${{ inputs.environment || 'production' }}-${{ github.run_id }}
          restore-keys: |
            jobs-db-${{ inputs.environment || 'production' }}-

      - name: Trigger telegram bot
        run: python main.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          # Prefer CHAT_ID; fall back to the per-environment names that predate
          # it. GitHub exposes only the active environment's secrets, so at most
          # one of these is ever non-empty.
          CHAT_ID: ${{ secrets.CHAT_ID || secrets.PROD_CHAT_ID || secrets.STAGING_CHAT_ID }}
